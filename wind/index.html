<!DOCTYPE HTML>
<html>

<head>
  <meta charset=utf-8>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind - Boia Somorrostro</title>
  <meta name="description"
    content="Wind data from boia somorrostro">
  <meta name="author" content="Gerard Llorach">
  <link rel="shortcut icon" type="image/png" href="/boiasomorrostro/favicon.ico"/>

  <!-- Font poppins, same as the main app -->
  <link rel="stylesheet" type="text/css" href="../lib/font-poppins.css" />
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

  <!-- Every ring, chip and label below is created by wind.js and positioned
       from the centre of #stage. The .hidden class starts them collapsed so
       they expand into place once the data is in. -->
  <div id="stage" class="hidden">
    <div id="past"></div>
    <!-- Before #forecast: in future view this ring is the filled boundary the
         forecast rings sit inside, so it has to paint underneath them. -->
    <div id="now-ring" class="ring"></div>
    <div id="forecast"></div>
    <div id="compass"></div>

    <div id="now-panel">
      <div>
        <span id="now-speed">--</span>
        <span id="now-unit" title="Canvia les unitats">kn</span>
      </div>
      <span id="now-name"></span>
      <span id="now-ago"></span>
      <span id="now-date"></span>
    </div>
  </div>

  <div id="status"></div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-message">Carregant…</div>
  </div>

  <script src="wind.js"></script>

</body>

</html>
